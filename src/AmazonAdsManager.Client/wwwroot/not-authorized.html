<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Not Authorized</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      text-align: center;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      max-width: 420px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { color: #666; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.4rem;
      background: #4285f4;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    a:hover { background: #3367d6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access Restricted</h1>
    <p>This account has not been granted access. Please contact Peter to request an invitation.</p>
    <a href="/.auth/logout">Sign out</a>
  </div>
</body>
</html>
