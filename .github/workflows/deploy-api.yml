name: Deploy API to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: dotnet publish src/AmazonAdsManager.Api/AmazonAdsManager.Api.csproj -c Release -o publish/api

      - name: Zip publish output
        run: cd publish/api && zip -r ../../api.zip .

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name ${{ vars.AZURE_FUNCTIONS_APP_NAME }} \
            --resource-group amazon-ads-manager-rg \
            --src api.zip
