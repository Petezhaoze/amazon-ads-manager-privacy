name: Deploy to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AmazonAdsManager.sln

      - name: Build
        run: dotnet build AmazonAdsManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test AmazonAdsManager.sln -c Release --no-build --no-restore

      - name: Set API URL
        run: echo '{"ApiBaseUrl":"${{ vars.FUNCTIONS_API_URL }}"}' > src/AmazonAdsManager.Client/wwwroot/appsettings.json

      - name: Publish Client
        run: dotnet publish src/AmazonAdsManager.Client/AmazonAdsManager.Client.csproj -c Release --no-build -o publish/client

      - name: Copy SWA config
        run: cp staticwebapp.config.json publish/client/wwwroot/

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/client/wwwroot
          output_location: ''

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
