name: Daily Analytics Import

on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily analytics pipeline
        run: |
          curl -sf -X POST \
            -H "x-runner-key: ${{ secrets.ANALYTICS_RUNNER_KEY }}" \
            -H "content-type: application/json" \
            -d "{\"accountKey\":\"${{ secrets.DEFAULT_ACCOUNT_KEY }}\"}" \
            "${{ secrets.API_BASE_URL }}/api/analytics/run-daily"
